# Fly.io configuration for AI Human Game
# Deploy: fly launch && fly deploy

app = "ai-human-game"
primary_region = "sin"  # Singapore - closest to Vietnam

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
