	<!-- Fix for GitHub Pages -->
	<script>
		// Override location checks for GitHub Pages compatibility
		if (window.location.hostname.includes('github.io')) {
			// Set base path for assets
			var basePath = window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/') + 1);
			
			// Override fetch for proper path resolution
			if (window.fetch) {
				var originalFetch = window.fetch;
				window.fetch = function(url, options) {
					if (typeof url === 'string' && !url.startsWith('http') && !url.startsWith('data:') && !url.startsWith('blob:')) {
						if (!url.startsWith('./') && !url.startsWith('../') && !url.startsWith('/')) {
							url = basePath + url;
						}
					}
					return originalFetch.call(this, url, options);
				};
			}
			
			// Override XMLHttpRequest for asset loading
			var originalOpen = XMLHttpRequest.prototype.open;
			XMLHttpRequest.prototype.open = function(method, url, async, user, password) {
				if (typeof url === 'string' && !url.startsWith('http') && !url.startsWith('data:') && !url.startsWith('blob:')) {
					if (!url.startsWith('./') && !url.startsWith('../') && !url.startsWith('/')) {
						url = basePath + url;
					}
				}
				return originalOpen.call(this, method, url, async, user, password);
			};
			
			// Prevent potential JSON parsing issues from responseText
			var originalSend = XMLHttpRequest.prototype.send;
			XMLHttpRequest.prototype.send = function(data) {
				var self = this;
				this.addEventListener('load', function() {
					try {
						if (self.responseType === '' || self.responseType === 'text') {
							// Validate responseText is valid if it looks like JSON
							if (self.responseText && self.responseText.trim().startsWith('{')) {
								JSON.parse(self.responseText); // Test parse
							}
						}
					} catch (e) {
						console.warn('JSON parse warning:', e, 'URL:', self.responseURL);
					}
				});
				return originalSend.call(this, data);
			};
		}
		
		// Add error handler for debugging
		window.addEventListener('error', function(e) {
			console.error('Global error:', e.message, e.filename, e.lineno, e.colno, e.error);
		});
		
		// Suppress some JSON parsing errors that might be false positives
		var originalJSONParse = JSON.parse;
		JSON.parse = function(text, reviver) {
			try {
				return originalJSONParse.call(this, text, reviver);
			} catch (e) {
				console.warn('JSON.parse error, attempting recovery:', e.message);
				// Try to clean the text
				if (typeof text === 'string') {
					text = text.trim();
					// Remove potential BOM or other invisible characters
					text = text.replace(/^\uFEFF/, '');
					try {
						return originalJSONParse.call(this, text, reviver);
					} catch (e2) {
						// If still fails, throw original error
						throw e;
					}
				}
				throw e;
			}
		};
	</script>

<script type="text/javascript">
          function setUserAgent(window, userAgent) {
           // Works on Firefox, Chrome, Opera and IE9+
            if (navigator.__defineGetter__) {
                navigator.__defineGetter__("userAgent", function () {
                    return userAgent;
                });
            } else if (Object.defineProperty) {
                Object.defineProperty(navigator, "userAgent", {
                    get: function () {
                        return userAgent;
                    }
                });
            }
            // Works on Safari
            if (window.navigator.userAgent !== userAgent) {
                var userAgentProp = {
                    get: function () {
                        return userAgent;
                    }
                };
                try {
                    Object.defineProperty(window.navigator, "userAgent", userAgentProp);
                } catch (e) {
                    window.navigator = Object.create(navigator, {
                        userAgent: userAgentProp
                    });
                }
            }
          }
          if(window.navigator.userAgent.indexOf("Safari")>=0 && "ontouchstart" in window && window.navigator.userAgent.indexOf("iPhone")== -1) {
