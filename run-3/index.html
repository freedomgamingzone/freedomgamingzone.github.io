	<script>
		// Clear old localStorage if corrupted - allows game to start fresh
		try {
			// Check if there's old data with different path
			var keysToCheck = ['/run-3/', '/g4wgzmu/'];
			var foundOldKeys = false;
			
			for (var i = 0; i < localStorage.length; i++) {
				var key = localStorage.key(i);
				if (key && (key.indexOf('/run-3/') === 0 || key.indexOf('/g4wgzmu/') === 0)) {
					foundOldKeys = true;
					break;
				}
			}
			
			// If found old keys from different paths, clear them to allow fresh start
			if (foundOldKeys) {
				console.log('[Run3 Fix] Clearing old localStorage data to allow fresh start...');
				var keysToRemove = [];
				for (var i = 0; i < localStorage.length; i++) {
					var key = localStorage.key(i);
					if (key && (key.indexOf('/run-3/') === 0 || key.indexOf('/g4wgzmu/') === 0 || key.indexOf('run-3') !== -1)) {
						keysToRemove.push(key);
					}
				}
				keysToRemove.forEach(function(key) {
					localStorage.removeItem(key);
				});
				console.log('[Run3 Fix] Cleared ' + keysToRemove.length + ' old keys. Game will start fresh.');
			}
		} catch(e) {
			console.warn('[Run3 Fix] Could not check localStorage:', e);
		}
	</script>

<script type="text/javascript">
          function setUserAgent(window, userAgent) {
           // Works on Firefox, Chrome, Opera and IE9+
            if (navigator.__defineGetter__) {
                navigator.__defineGetter__("userAgent", function () {
                    return userAgent;
                });
            } else if (Object.defineProperty) {
                Object.defineProperty(navigator, "userAgent", {
                    get: function () {
                        return userAgent;
                    }
                });
            }
            // Works on Safari
            if (window.navigator.userAgent !== userAgent) {
                var userAgentProp = {
                    get: function () {
                        return userAgent;
                    }
                };
                try {
                    Object.defineProperty(window.navigator, "userAgent", userAgentProp);
                } catch (e) {
                    window.navigator = Object.create(navigator, {
                        userAgent: userAgentProp
                    });
                }
            }
          }
          if(window.navigator.userAgent.indexOf("Safari")>=0 && "ontouchstart" in window && window.navigator.userAgent.indexOf("iPhone")== -1) {
            //var userAgent = window.navigator.userAgent.replace("Macintosh", "iPad");
            var userAgent = "Mozilla/5.0 (iPad; CPU OS 13_1_2 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/13.0.1 Mobile/15E148 Safari/604.1";
            setUserAgent(window,userAgent);
          }
