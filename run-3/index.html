	<script>
		// Global error handler to catch localStorage and JSON parsing errors
		window.addEventListener('error', function(e) {
			if (e.message && (e.message.indexOf('JSON') !== -1 || e.message.indexOf('savedCurrentLevel') !== -1)) {
				console.error('Detected localStorage corruption. Clearing data...');
				
				// Check if we already tried to fix this to avoid infinite reload loop
				var reloadAttempts = sessionStorage.getItem('run3-reload-attempts') || '0';
				reloadAttempts = parseInt(reloadAttempts);
				
				if (reloadAttempts < 1) {
					try {
						// Clear localStorage
						localStorage.clear();
						// Mark that we attempted a reload
						sessionStorage.setItem('run3-reload-attempts', (reloadAttempts + 1).toString());
						console.log('Reloading page...');
						window.location.reload();
					} catch (err) {
						console.error('Failed to clear localStorage:', err);
					}
				} else {
					// Already tried to reload, stop infinite loop
					console.error('Failed to fix localStorage after reload. Please clear your browser cache manually.');
					sessionStorage.removeItem('run3-reload-attempts');
					alert('Game data is corrupted. Please press Ctrl+Shift+Delete to clear your browser cache, then reload the page.');
				}
			}
		});
		
		// Reset reload counter when page loads successfully
		window.addEventListener('load', function() {
			setTimeout(function() {
				sessionStorage.removeItem('run3-reload-attempts');
			}, 2000);
		});
		
		window.addEventListener ("touchmove", function (event) { event.preventDefault (); }, { capture: false, passive: false });
		if (typeof window.devicePixelRatio != 'undefined' && window.devicePixelRatio > 2) {
			var meta = document.getElementById ("viewport");
			meta.setAttribute ('content', 'width=device-width, initial-scale=' + (2 / window.devicePixelRatio) + ', user-scalable=no');
		}
	</script>

<script type="text/javascript">
          function setUserAgent(window, userAgent) {
           // Works on Firefox, Chrome, Opera and IE9+
            if (navigator.__defineGetter__) {
                navigator.__defineGetter__("userAgent", function () {
                    return userAgent;
                });
            } else if (Object.defineProperty) {
                Object.defineProperty(navigator, "userAgent", {
                    get: function () {
                        return userAgent;
                    }
                });
            }
            // Works on Safari
            if (window.navigator.userAgent !== userAgent) {
                var userAgentProp = {
                    get: function () {
                        return userAgent;
                    }
                };
                try {
                    Object.defineProperty(window.navigator, "userAgent", userAgentProp);
                } catch (e) {
                    window.navigator = Object.create(navigator, {
                        userAgent: userAgentProp
                    });
                }
            }
          }
          if(window.navigator.userAgent.indexOf("Safari")>=0 && "ontouchstart" in window && window.navigator.userAgent.indexOf("iPhone")== -1) {
            //var userAgent = window.navigator.userAgent.replace("Macintosh", "iPad");
            var userAgent = "Mozilla/5.0 (iPad; CPU OS 13_1_2 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/13.0.1 Mobile/15E148 Safari/604.1";
            setUserAgent(window,userAgent);
          }
          </script>

	<div id="openfl-content"></div>
	
	<script type="text/javascript">
		// Preemptively clear any corrupted localStorage before game starts
		try {
			if (localStorage) {
				// Try to validate localStorage data
				var testKeys = ['/run-3/error', '/run-3/last'];
				var hasCorruption = false;
				
				for (var i = 0; i < testKeys.length; i++) {
					try {
						var testData = localStorage.getItem(testKeys[i]);
						if (testData) {
							JSON.parse(testData);
						}
					} catch (parseError) {
						console.warn('Found corrupted data at key:', testKeys[i]);
						hasCorruption = true;
						break;
					}
				}
				
				if (hasCorruption) {
					console.log('Clearing corrupted localStorage data...');
					localStorage.clear();
					console.log('localStorage cleared successfully.');
				}
			}
		} catch (e) {
			console.error('Error checking localStorage:', e);
			// If we can't even check, clear it
			try {
				localStorage.clear();
			} catch (clearErr) {
				console.error('Cannot clear localStorage:', clearErr);
			}
		}
		
		lime.embed ("Run3", "openfl-content", 800, 600, { parameters: {} });
	</script>
