	<script>
		// CRITICAL FIX: Patch Storage.prototype to normalize localStorage keys
		// This must run BEFORE Run3.js loads
		(function() {
			// One-time cleanup
			if (!sessionStorage.getItem('run3_storage_patched')) {
				console.log('[Run3 Fix] Clearing corrupted data and patching storage...');
				localStorage.clear();
				sessionStorage.setItem('run3_storage_patched', 'true');
			}
			
			// Save original methods
			var _getItem = Storage.prototype.getItem;
			var _setItem = Storage.prototype.setItem;
			var _removeItem = Storage.prototype.removeItem;
			
			// Normalize key: /run-3/abc -> /abc, /g4wgzmu/xyz -> /xyz
			function normalizeKey(key) {
				return String(key).replace(/^\/[^\/]+\//, '/');
			}
			
			// Patch Storage prototype
			Storage.prototype.getItem = function(key) {
				var norm = normalizeKey(key);
				if (key !== norm) console.log('[LS get]', key, '->', norm);
				return _getItem.call(this, norm);
			};
			
			Storage.prototype.setItem = function(key, value) {
				var norm = normalizeKey(key);
				if (key !== norm) console.log('[LS set]', key, '->', norm);
				return _setItem.call(this, norm, value);
			};
			
			Storage.prototype.removeItem = function(key) {
				var norm = normalizeKey(key);
				if (key !== norm) console.log('[LS remove]', key, '->', norm);
				return _removeItem.call(this, norm);
			};
			
			console.log('[Run3 Fix] Storage.prototype patched successfully');
			
			// DEBUG: Wrap JSON.parse to catch parsing errors
			var _JSONparse = JSON.parse;
			JSON.parse = function(text) {
				try {
					return _JSONparse(text);
				} catch(e) {
					console.error('[JSON Parse Error]', e.message);
					console.error('[JSON Data]', text ? text.substring(0, 200) : 'null');
					throw e;
				}
			};
		})();
	</script>

<script type="text/javascript">
          function setUserAgent(window, userAgent) {
           // Works on Firefox, Chrome, Opera and IE9+
            if (navigator.__defineGetter__) {
                navigator.__defineGetter__("userAgent", function () {
                    return userAgent;
                });
            } else if (Object.defineProperty) {
                Object.defineProperty(navigator, "userAgent", {
                    get: function () {
                        return userAgent;
                    }
                });
            }
            // Works on Safari
            if (window.navigator.userAgent !== userAgent) {
                var userAgentProp = {
                    get: function () {
                        return userAgent;
                    }
                };
                try {
                    Object.defineProperty(window.navigator, "userAgent", userAgentProp);
                } catch (e) {
                    window.navigator = Object.create(navigator, {
                        userAgent: userAgentProp
                    });
                }
            }
          }
          if(window.navigator.userAgent.indexOf("Safari")>=0 && "ontouchstart" in window && window.navigator.userAgent.indexOf("iPhone")== -1) {
            //var userAgent = window.navigator.userAgent.replace("Macintosh", "iPad");
            var userAgent = "Mozilla/5.0 (iPad; CPU OS 13_1_2 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/13.0.1 Mobile/15E148 Safari/604.1";
            setUserAgent(window,userAgent);
          }
          </script>

<script>function fnSendMsg(evt){

		}

		});
